services:
  - type: web
    name: memocean-api
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npx --yes pnpm@9.15.0 install --frozen-lockfile --prod=false && npx --yes pnpm@9.15.0 --filter @memocean/core build && npx --yes pnpm@9.15.0 --filter @memocean/api build
    preDeployCommand: npx --yes pnpm@9.15.0 --filter @memocean/api db:migrate
    startCommand: npx --yes pnpm@9.15.0 --filter @memocean/api start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: WORKER_DATABASE_URL
        sync: false
      - key: ENABLE_WORKER
        value: "false"
      - key: PUBLIC_API_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: AUTH_DOMAIN
        sync: false
      - key: TOKEN_HASH_PEPPER
        sync: false
      - key: KEK_V1_BASE64
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_BASE_URL
        sync: false
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "1024"
      - key: OPENROUTER_HTTP_REFERER
        sync: false
      - key: OPENROUTER_APP_NAME
        sync: false
      - key: AVALANCHE_RPC_URL
        value: https://api.avax-test.network/ext/bc/C/rpc
      - key: CHAIN_ID
        value: "43113"
      - key: MARKETPLACE_ADDRESS
        sync: false
      - key: CHAIN_CONFIRMATIONS
        value: "3"
      - key: JOB_CONCURRENCY
        value: "2"

  - type: web
    name: memocean-web
    runtime: static
    buildCommand: npx --yes pnpm@9.15.0 install --frozen-lockfile --prod=false && npx --yes pnpm@9.15.0 --filter @memocean/core build && npx --yes pnpm@9.15.0 --filter @memocean/web build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: VITE_API_URL
        sync: false
      - key: VITE_CHAIN_ID
        value: "43113"
      - key: VITE_MARKETPLACE_ADDRESS
        sync: false
      - key: VITE_WALLETCONNECT_PROJECT_ID
        sync: false
      - key: VITE_AVALANCHE_RPC_URL
        value: https://api.avax-test.network/ext/bc/C/rpc

databases:
  - name: memocean-db
    region: singapore
    plan: 0.1c-256mb
    postgresMajorVersion: "18"
    databaseName: memocean
    user: memocean_bootstrap
    ipAllowList: []
