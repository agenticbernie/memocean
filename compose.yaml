services:
  db:
    image: pgvector/pgvector:0.8.1-pg18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memocean}
      POSTGRES_USER: ${POSTGRES_USER:-memocean_bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the untracked .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - memocean-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  memocean-db-data:
